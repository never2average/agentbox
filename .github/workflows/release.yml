name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the controller image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/agentbox-controller:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/agentbox-controller:latest

  release:
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Render the install manifest for this version
        run: python tools/generate_install.py --version ${{ github.ref_name }}
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: install.yaml
          generate_release_notes: true
          body: |
            ```bash
            kubectl apply -f https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/install.yaml
            ```

            Installs the 16 CRDs and the controller. See the
            [quickstart](https://github.com/${{ github.repository }}/blob/main/docs/quickstart.md).
