name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python test_crud_basic.py

  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: CRD manifests are up to date
        run: python tools/generate_crds.py --check
      - name: CRD reference is up to date
        run: python tools/generate_crd_docs.py --check
      - name: Install manifest is up to date
        run: python tools/generate_install.py --check
      - name: Helm chart CRDs are up to date
        run: python tools/sync_chart.py --check
      - name: Helm chart lints
        run: helm lint charts/agentbox
      - name: The chart asks for an image tag that exists
        run: |
          rendered=$(helm template agentbox charts/agentbox \
            | grep -oE 'ghcr.io/[^"]*agentbox-controller:[^ ]+' | head -1)
          appversion=$(grep '^appVersion:' charts/agentbox/Chart.yaml | tr -d '"' | awk '{print $2}')
          echo "rendered: $rendered"
          case "$rendered" in
            *:"$appVersion") ;;
            *) echo "chart renders $rendered but appVersion is $appVersion"; exit 1 ;;
          esac

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: The controller image builds
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: agentbox-controller:ci

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create cluster
        uses: helm/kind-action@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build the controller image and load it into the cluster
        run: |
          # the kind action picks the cluster name, so read it back rather than
          # assuming one
          context=$(kubectl config current-context)
          echo "KUBE_CONTEXT=$context" >> "$GITHUB_ENV"
          docker build -t ghcr.io/never2average/agentbox-controller:latest .
          kind load docker-image ghcr.io/never2average/agentbox-controller:latest \
            --name "${context#kind-}"
      - name: End-to-end suite
        run: |
          python tests/e2e_test.py \
            --context "$KUBE_CONTEXT" \
            --kubeconfig "$HOME/.kube/config" \
            --image ghcr.io/never2average/agentbox-controller:latest
      - name: Dump state on failure
        if: failure()
        run: |
          kubectl get pods -A || true
          kubectl -n agentbox-demo-e2e describe pods || true
          kubectl -n agentbox-system logs deploy/agentbox-controller --tail=100 || true
