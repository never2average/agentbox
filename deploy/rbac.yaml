apiVersion: v1
kind: Namespace
metadata:
  name: agentbox-system
  labels:
    app.kubernetes.io/part-of: agentbox
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentbox-controller
  namespace: agentbox-system
  labels:
    app.kubernetes.io/part-of: agentbox
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agentbox-controller
  labels:
    app.kubernetes.io/part-of: agentbox
rules:
  # The AgentBox resources themselves, and their status and scale subresources
  - apiGroups: ["ai.agentbox.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["ai.agentbox.io"]
    resources: ["*/status", "*/scale"]
    verbs: ["get", "update", "patch"]
  # The workloads they own
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "secrets", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # Identity for agents
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Leader election
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
  # Metrics used by autoscalers, meters and guardrails
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agentbox-controller
  labels:
    app.kubernetes.io/part-of: agentbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agentbox-controller
subjects:
  - kind: ServiceAccount
    name: agentbox-controller
    namespace: agentbox-system
