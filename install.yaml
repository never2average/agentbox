        statusReplicasPath: .status.replicas
        labelSelectorPath: .status.selector
    schema:
      openAPIV3Schema:
        type: object
        description: 'Serving-plane agent harness: runs a developer-supplied image as a Kubernetes workload
          with the compute, endpoints and health it declares. What the agent talks to - models, gateways,
          tool servers, data - is the image''s business at runtime.'
        required:
        - spec
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            required:
            - runtimeKind
            - code
            properties:
              runtimeKind:
                enum:
                - server
                - worker
                - batch
                - cron
                description: Workload shape backing this harness.
                type: string
              code:
                type: object
                required:
                - image
                properties:
                  image:
                    type: string
                    pattern: ^[a-z0-9]([a-z0-9._\-/]*[a-z0-9])?(:[\w][\w.\-]{0,127})?(@sha256:[a-f0-9]{64})?$
                  entrypoint:
                    type: string
                  args:
                    type: array
                    items:
                      type: string
                    maxItems: 64
                description: The developer-supplied image to run.
              replicas:
                type: integer
                minimum: 0
                default: 1
                description: Desired replicas. Ignored while a HarnessSwarmAutoScaler owns this harness.
                maximum: 10000
              compute:
                type: object
                description: CPU, memory, GPU and storage requested per replica.
                properties:
                  cpu:
                    type: object
                    properties:
                      cores:
                        type: number
                        minimum: 0
                        maximum: 1024
                      threads:
                        type: integer
                        minimum: 0
                      memoryMb:
                        type: integer
                        minimum: 16
                  gpu:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                        default: false
                      type:
                        type: string
                      count:
                        type: integer
                        minimum: 0
                      memoryMb:
                        type: integer
                        minimum: 0
                  storage:
                    type: object
                    properties:
                      persist:
                        type: boolean
                        default: false
                      sizeInGb:
                        type: integer
                        minimum: 0
                      iops:
                        type: integer
                        minimum: 0
              env:
                type: object
                additionalProperties:
                  type: string
                description: Environment variables passed to the image. Secret-looking values are moved
                  into a Secret.
              endpoints:
                type: array
                items:
                  type: object
                  required:
                  - name
                  - port
                  properties:
                    name:
                      type: string
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      maxLength: 253
                      description: RFC 1123 name, as used by metadata.name
                    interface:
                      enum:
                      - http
                      - grpc
                      - websocket
                      default: http
                      type: string
                    port:
                      type: integer
                      minimum: 1
                      maximum: 65535
                    path:
                      type: string
                      default: /
                      pattern: ^/
                maxItems: 16
                description: Ports the harness serves on. A Service is created for these.
              schedule:
                type: object
                required:
                - cronExpression
                properties:
                  cronExpression:
                    type: string
                    pattern: ^(@(annually|yearly|monthly|weekly|daily|hourly)|((\*|[0-9,\-*/]+)\s+){4}(\*|[0-9,\-*/]+))$
                  timezone:
                    type: string
                    default: UTC
                description: Only meaningful when runtime_kind is cron.
              health:
                type: object
                properties:
                  type:
                    enum:
                    - http
                    - tcp
                    - exec
                    default: http
                    type: string
                  path:
                    type: string
                    default: /healthz
                  port:
                    type: integer
                    minimum: 1
                    maximum: 65535
                  command:
                    type: array
                    items:
                      type: string
                  initialDelaySeconds:
                    type: integer
                    minimum: 0
                    default: 10
                  periodSeconds:
                    type: integer
                    minimum: 1
                    default: 30
                description: Readiness probe for the harness container.
              files:
                type: object
                description: Files written into the container from a ConfigMap or Secret. The key is the
                  mount path.
                additionalProperties:
                  type: object
                  required:
                  - name
                  properties:
                    name:
                      type: string
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      maxLength: 253
                      description: ConfigMap or Secret name in the same namespace.
                    kind:
                      enum:
                      - ConfigMap
                      - Secret
                      default: ConfigMap
                      type: string
              secrets:
                type: object
                description: Environment variables injected from Secrets.
                additionalProperties:
                  type: object
                  description: A key inside a Secret in the same namespace. Credentials belong here, never
                    inline in a spec that lands in git and etcd.
                  required:
                  - name
                  - key
                  properties:
                    name:
                      type: string
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      maxLength: 253
                      description: Secret name.
                    key:
                      type: string
                      pattern: ^[-._a-zA-Z0-9]+$
                      description: Key within the Secret.
            x-kubernetes-validations:
            - rule: self.runtimeKind != 'cron' || has(self.schedule)
              message: schedule is required when runtimeKind is cron
            - rule: self.runtimeKind != 'server' || (has(self.endpoints) && self.endpoints.size() > 0)
              message: a server harness must declare at least one endpoint
            - rule: '!has(self.health) || self.health.type != ''exec'' || has(self.health.command)'
              message: health.command is required when health.type is exec
            - rule: '!has(self.env) || self.env.all(k, k.matches(''^[A-Za-z_][A-Za-z0-9_]*$''))'
              message: env keys must be valid environment variable names
          status:
            type: object
            description: Standard status subresource shared by every AgentBox CRD
            properties:
              state:
                enum:
                - pending
                - active
                - degraded
                - suspended
                - completed
