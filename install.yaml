          status:
            type: object
            description: Standard status subresource shared by every AgentBox CRD
            properties:
              state:
                enum:
                - pending
                - active
                - degraded
                - suspended
                - completed
                - failed
                - inactive
                - unknown
                type: string
              message:
                type: string
              observedGeneration:
                type: integer
                minimum: 0
              conditions:
                type: array
                items:
                  type: object
                  required:
                  - type
                  - status
                  properties:
                    type:
                      type: string
                      minLength: 1
                    status:
                      enum:
                      - 'True'
                      - 'False'
                      - Unknown
                      type: string
                    reason:
                      type: string
                    message:
                      type: string
                    lastTransitionTime:
                      type: string
                      format: date-time
              lastTransitionTime:
                type: string
                format: date-time
              replicas:
                type: integer
                minimum: 0
                description: Total replicas observed. Read by the scale subresource.
              readyReplicas:
                type: integer
                minimum: 0
              selector:
                type: string
                description: Label selector in string form. Read by the scale subresource.
            x-kubernetes-preserve-unknown-fields: true
