# from ai-meter.yaml
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: aimeters.ai.agentbox.io
  labels:
    app.kubernetes.io/part-of: agentbox
    app.kubernetes.io/managed-by: ai-ctl
spec:
  group: ai.agentbox.io
  scope: Namespaced
  names:
    kind: AIMeter
    listKind: AIMeterList
    singular: aimeter
    plural: aimeters
    shortNames:
    - aime
    categories:
    - agentbox
  versions:
  - name: v1beta1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        description: 'Observability-plane meter: turns AIMetric streams into billable usage (tokens, calls,
          GPU-seconds), attributes it to a tenant dimension, prices it and enforces budgets.'
        required:
        - spec
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            required:
            - usage
            - window
            properties:
              usage:
                type: object
                description: What is being metered and where the raw counts come from.
                required:
                - unit
                - source
                properties:
                  unit:
                    enum:
                    - inputTokens
                    - outputTokens
                    - totalTokens
                    - requests
                    - toolCalls
                    - agentSessions
                    - gpuSeconds
                    - cpuSeconds
                    - trainingSteps
                    - bytesProcessed
                    type: string
                  source:
                    type: object
                    required:
                    - metric
                    properties:
                      metric:
                        type: string
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                        maxLength: 253
                        description: Name of the AIMetric supplying raw counts.
                      statistic:
                        enum:
                        - Sum
                        - Average
                        - Maximum
                        - Minimum
                        - SampleCount
                        default: Sum
                        type: string
                  subjects:
                    type: array
                    description: Names of the resources whose usage is metered.
                    items:
                      type: string
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      maxLength: 253
                      description: RFC 1123 name, as used by metadata.name
              attribution:
                type: object
                description: Dimensions the usage is split by, typically the billing tenant.
                properties:
                  dimensions:
                    type: array
                    items:
                      type: string
                      minLength: 1
                  defaultTenant:
                    type: string
              window:
                type: object
                required:
                - type
                properties:
                  type:
                    enum:
                    - tumbling
                    - sliding
                    - billingPeriod
                    type: string
                  durationSeconds:
                    type: integer
                    minimum: 1
                  period:
                    enum:
                    - hourly
                    - daily
                    - weekly
                    - monthly
                    type: string
                  timezone:
                    type: string
                    default: UTC
                description: 'Accounting window: tumbling, sliding, or a billing period.'
              pricing:
                type: object
                description: Optional cost model applied to metered usage.
                properties:
                  currency:
                    type: string
                    default: USD
                  model:
                    enum:
                    - flat
                    - tiered
                    - perUnit
                    default: perUnit
                    type: string
                  unitPrice:
                    type: number
                    minimum: 0
                  perUnits:
                    type: integer
                    minimum: 1
                    default: 1
                  tiers:
                    type: array
                    items:
                      type: object
                      required:
                      - upTo
                      - unitPrice
                      properties:
                        upTo:
                          type: number
                          minimum: 0
                        unitPrice:
                          type: number
                          minimum: 0
              budget:
                type: object
                description: Quota or spend ceiling enforced for the window.
                properties:
                  limit:
                    type: number
                    minimum: 0
                  limitType:
                    enum:
                    - usage
                    - cost
                    default: cost
                    type: string
                  alertThresholdsPercent:
                    type: array
                    items:
                      type: number
                      minimum: 0
                      maximum: 100
                    maxItems: 10
                  onExceed:
                    enum:
                    - alert
                    - throttle
                    - block
                    default: alert
                    type: string
              export:
                type: object
                description: Where metered records are emitted for billing or analytics.
                properties:
                  enabled:
                    type: boolean
                    default: false
                  destination:
                    enum:
                    - prometheus
                    - otlp
                    - s3
                    - kafka
                    - webhook
                    type: string
                  endpoint:
                    type: string
                    format: uri
                  intervalSeconds:
                    type: integer
                    minimum: 1
                    default: 300
              retentionDays:
                type: integer
                minimum: 1
                default: 400
                description: How long metered records are kept.
              enabled:
                type: boolean
                default: true
                description: Set false to stop metering without deleting the meter.
            x-kubernetes-validations:
            - rule: self.window.type != 'billingPeriod' || has(self.window.period)
              message: window.period is required for a billingPeriod window
            - rule: self.window.type == 'billingPeriod' || has(self.window.durationSeconds)
              message: window.durationSeconds is required for tumbling and sliding windows
            - rule: '!has(self.pricing) || self.pricing.model != ''tiered'' || has(self.pricing.tiers)'
              message: pricing.tiers is required when pricing.model is tiered
          status:
            type: object
            description: Standard status subresource shared by every AgentBox CRD
            properties:
              state:
                enum:
                - pending
                - active
                - degraded
                - suspended
                - completed
                - failed
                - inactive
                - unknown
                type: string
              message:
                type: string
              observedGeneration:
                type: integer
                minimum: 0
              conditions:
                type: array
                items:
                  type: object
                  required:
                  - type
                  - status
                  properties:
                    type:
                      type: string
                      minLength: 1
                    status:
                      enum:
                      - 'True'
                      - 'False'
                      - Unknown
                      type: string
                    reason:
                      type: string
                    message:
                      type: string
                    lastTransitionTime:
                      type: string
                      format: date-time
              lastTransitionTime:
                type: string
                format: date-time
              replicas:
                type: integer
                minimum: 0
                description: Total replicas observed. Read by the scale subresource.
              readyReplicas:
                type: integer
                minimum: 0
              selector:
                type: string
                description: Label selector in string form. Read by the scale subresource.
            x-kubernetes-preserve-unknown-fields: true
    additionalPrinterColumns:
    - name: Unit
      type: string
      jsonPath: .spec.usage.unit
    - name: Window
      type: string
      jsonPath: .spec.window.type
    - name: Budget
      type: number
      jsonPath: .spec.budget.limit
    - name: State
      type: string
      jsonPath: .status.state
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp

