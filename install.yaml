    - agentbox
  versions:
  - name: v1beta1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        description: 'Serving-plane LLM gateway: provider routing, rate limits and per-model runtime parameters.'
        required:
        - spec
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            properties:
              modelName:
                type: string
                description: Name callers use when routing through this gateway.
              litellmParams:
                type: object
                required:
                - model
                - apiBase
                properties:
                  model:
                    type: string
                  apiBase:
                    type: string
                    format: uri
                  apiKey:
                    type: string
                    description: 'Deprecated: an inline credential is stored in plaintext in etcd and
                      in whatever repository holds this object. Use apiKeySecretRef.'
                  apiKeySecretRef:
                    type: object
                    description: Secret holding the upstream API key. The controller injects it into the
                      gateway as an environment variable and renders os.environ/... into the config, so
                      the value is never written to a ConfigMap.
                    required:
                    - name
                    - key
                    properties:
                      name:
                        type: string
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                        maxLength: 253
                        description: Secret name.
                      key:
                        type: string
                        pattern: ^[-._a-zA-Z0-9]+$
                        description: Key within the Secret.
                  apiVersion:
                    type: string
                  customLlmProvider:
                    type: string
                  rpm:
                    type: integer
                    minimum: 0
                    maximum: 10000000
                  tpm:
                    type: integer
                    minimum: 0
                    maximum: 1000000000
                  timeout:
                    type: integer
                    minimum: 1
                    maximum: 3600
                  stream:
                    type: boolean
                    default: false
                  maxTokens:
                    type: integer
                    minimum: 1
                  temperature:
                    type: number
                    minimum: 0
                    maximum: 2
                  topP:
                    type: number
                    minimum: 0
                    maximum: 1
                  frequencyPenalty:
                    type: number
                    minimum: 0
                    maximum: 2
                  presencePenalty:
                    type: number
                    minimum: 0
                    maximum: 2
                description: Upstream provider, credentials and per-model runtime parameters.
              modelInfo:
                type: object
                required:
                - id
                - mode
                properties:
                  id:
                    type: string
                  mode:
                    enum:
                    - chat
                    - completion
                    - embedding
                    type: string
                  supportsFunctionCalling:
                    type: boolean
                    default: false
                  supportsVision:
                    type: boolean
                    default: false
                  supportsStreaming:
                    type: boolean
                    default: true
                description: 'Capabilities advertised to callers: mode, function calling, vision, streaming.'
              serving:
                type: object
                description: How to run the gateway in-cluster. Omit to publish the routing config for
                  a gateway you already run.
                required:
                - image
                properties:
                  image:
                    type: string
                    pattern: ^[a-z0-9]([a-z0-9._\-/]*[a-z0-9])?(:[\w][\w.\-]{0,127})?(@sha256:[a-f0-9]{64})?$
                  entrypoint:
                    type: string
                  args:
                    type: array
                    items:
                      type: string
                    maxItems: 64
                  port:
                    type: integer
                    minimum: 1
                    maximum: 65535
                    default: 4000
                  env:
                    type: object
                    additionalProperties:
                      type: string
                  compute:
                    type: object
                    description: Compute request shared by workload-backed CRDs
                    properties:
                      cpu:
                        type: object
                        properties:
                          cores:
                            type: number
                            minimum: 0
                            maximum: 1024
                          threads:
                            type: integer
                            minimum: 0
                          memoryMb:
                            type: integer
                            minimum: 16
                      gpu:
                        type: object
                        properties:
                          enabled:
                            type: boolean
                            default: false
                          type:
                            type: string
                          count:
                            type: integer
                            minimum: 0
                          memoryMb:
                            type: integer
                            minimum: 0
                      storage:
                        type: object
                        properties:
                          persist:
                            type: boolean
                            default: false
                          sizeInGb:
                            type: integer
                            minimum: 0
                          iops:
