# from harness-swarm-autoscaler.yaml
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: harnessswarmautoscalers.ai.agentbox.io
  labels:
    app.kubernetes.io/part-of: agentbox
    app.kubernetes.io/managed-by: ai-ctl
spec:
  group: ai.agentbox.io
  scope: Namespaced
  names:
    kind: HarnessSwarmAutoScaler
    listKind: HarnessSwarmAutoScalerList
    singular: harnessswarmautoscaler
    plural: harnessswarmautoscalers
    shortNames:
    - hsas
    categories:
    - agentbox
  versions:
  - name: v1beta1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        description: 'Serving-plane autoscaler for a swarm of HarnessRuntimes: scales concurrent agent
          harnesses on session, queue and step-latency signals.'
        required:
        - spec
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            required:
            - scaleTargetRef
            - bounds
            - metrics
            properties:
              scaleTargetRef:
                description: Reference to the resource an AutoScaler owns
                type: object
                required:
                - kind
                - name
                properties:
                  apiVersion:
                    enum:
                    - ai.agentbox.io/v1beta1
                    description: API group/version shared by every AgentBox CRD
                    type: string
                  kind:
                    enum:
                    - HarnessRuntime
                    type: string
                  name:
                    type: string
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    maxLength: 253
                    description: RFC 1123 name, as used by metadata.name
                  namespace:
                    type: string
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    maxLength: 253
                    description: RFC 1123 name, as used by metadata.name
              bounds:
                type: object
                description: Replica floor and ceiling for the swarm.
                required:
                - maxReplicas
                properties:
                  minReplicas:
                    type: integer
                    minimum: 0
                    default: 1
                  maxReplicas:
                    type: integer
                    minimum: 1
                    maximum: 10000
              metrics:
                type: array
                minItems: 1
                items:
                  type: object
                  description: A single scaling signal, sourced from an AIMetric or a raw resource metric
                  required:
                  - type
                  - target
                  properties:
                    type:
                      enum:
                      - aiMetric
                      - resource
                      - external
                      type: string
                    metric:
                      type: string
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      maxLength: 253
                      description: Name of the AIMetric supplying this signal.
                    resource:
                      enum:
                      - cpu
                      - memory
                      - gpu
                      - gpuMemory
                      type: string
                    name:
                      type: string
                    selector:
                      type: object
                      additionalProperties:
                        type: string
                    target:
                      type: object
                      required:
                      - metricType
                      - value
                      properties:
                        metricType:
                          enum:
                          - utilization
                          - averageValue
                          - value
                          type: string
                        value:
                          type: number
                    weight:
                      type: number
                      minimum: 0
                      default: 1
                  x-kubernetes-validations:
                  - rule: '!(self.type == ''aiMetric'') || (has(self.metric))'
                    message: metric required when type=aiMetric
                  - rule: '!(self.type == ''resource'') || (has(self.resource))'
                    message: resource required when type=resource
                  - rule: '!(self.type == ''external'') || (has(self.name))'
                    message: name required when type=external
                maxItems: 8
                description: Signals the scaling decision reads, typically pending sessions or queue depth.
              behavior:
                type: object
                description: Stabilisation windows and rate limits on scale up and scale down.
                properties:
                  scaleUp:
                    type: object
                    properties:
                      stabilizationWindowSeconds:
                        type: integer
                        minimum: 0
                        default: 300
                        maximum: 3600
                      selectPolicy:
                        enum:
                        - max
                        - min
                        - disabled
                        default: max
                        type: string
                      policies:
                        type: array
                        items:
                          type: object
                          required:
                          - type
                          - value
                          - periodSeconds
                          properties:
                            type:
                              enum:
                              - pods
                              - percent
                              type: string
                            value:
                              type: integer
                              minimum: 1
                            periodSeconds:
                              type: integer
                              minimum: 1
                  scaleDown:
                    type: object
                    properties:
                      stabilizationWindowSeconds:
                        type: integer
                        minimum: 0
                        default: 300
                        maximum: 3600
                      selectPolicy:
                        enum:
