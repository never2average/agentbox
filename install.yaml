                            type: string
                            description: 'Deprecated: inline credentials are published into the connector
                              ConfigMap. Use bearerTokenSecretRef.'
                          bearerTokenSecretRef:
                            type: object
                            description: Secret supplying bearerToken. Referenced, never copied.
                            required:
                            - name
                            - key
                            properties:
                              name:
                                type: string
                                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                                maxLength: 253
                                description: Secret name.
                              key:
                                type: string
                                pattern: ^[-._a-zA-Z0-9]+$
                                description: Key within the Secret.
                          apiKey:
                            type: string
                            description: 'Deprecated: inline credentials are published into the connector
                              ConfigMap. Use apiKeySecretRef.'
                          apiKeySecretRef:
                            type: object
                            description: Secret supplying apiKey. Referenced, never copied.
                            required:
                            - name
                            - key
                            properties:
                              name:
                                type: string
                                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                                maxLength: 253
                                description: Secret name.
                              key:
                                type: string
                                pattern: ^[-._a-zA-Z0-9]+$
                                description: Key within the Secret.
                          apiKeyHeader:
                            type: string
                            default: X-API-Key
                          username:
                            type: string
                          passwordRef:
                            type: string
                            pattern: ^secret://
                            description: Reference to secret storage
                          credentialsRef:
                            type: string
                            pattern: ^secret://
                            description: Reference to credential file or secret
                          secretRef:
                            type: string
                            pattern: ^secret://
                          roleArn:
                            type: string
                            pattern: '^arn:aws:iam::'
