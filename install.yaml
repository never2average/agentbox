                    reason:
                      type: string
                    message:
                      type: string
                    lastTransitionTime:
                      type: string
                      format: date-time
              lastTransitionTime:
                type: string
                format: date-time
              replicas:
                type: integer
                minimum: 0
                description: Total replicas observed. Read by the scale subresource.
              readyReplicas:
