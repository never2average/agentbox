# from train-loop.yaml
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: trainloops.ai.agentbox.io
  labels:
    app.kubernetes.io/part-of: agentbox
    app.kubernetes.io/managed-by: ai-ctl
spec:
  group: ai.agentbox.io
  scope: Namespaced
  names:
    kind: TrainLoop
    listKind: TrainLoopList
    singular: trainloop
    plural: trainloops
    shortNames:
    - tl
    categories:
    - agentbox
  versions:
  - name: v1beta1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        description: 'Training-plane training loop: worker definition, schedule, dataset bindings and
          lifecycle.'
        required:
        - spec
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            properties:
              name:
                type: string
                description: Human-readable name for this loop.
              description:
                type: string
                description: What this loop trains or evaluates.
              type:
                enum:
                - training
                - dataProcessing
                - alertManager
                - scheduledTask
                description: What kind of work this loop performs.
                type: string
              version:
                type: string
                description: Version of this loop's definition.
              status:
                enum:
                - active
                - paused
                - stopped
                - error
                description: Whether the loop is running, paused or stopped.
                type: string
              worker:
                type: object
                required:
                - image
                properties:
                  image:
                    type: string
                    pattern: ^[a-z0-9]([a-z0-9._\-/]*[a-z0-9])?(:[\w][\w.\-]{0,127})?(@sha256:[a-f0-9]{64})?$
                  entrypoint:
                    type: string
                  args:
                    type: array
                    items:
                      type: string
                  env:
                    type: object
                    additionalProperties:
                      type: string
                  compute:
                    type: object
                    description: Compute request shared by workload-backed CRDs
                    properties:
                      cpu:
                        type: object
                        properties:
                          cores:
                            type: number
                            minimum: 0
                            maximum: 1024
                          threads:
                            type: integer
                            minimum: 0
                          memoryMb:
                            type: integer
                            minimum: 16
                      gpu:
                        type: object
                        properties:
                          enabled:
                            type: boolean
                            default: false
                          type:
                            type: string
                          count:
                            type: integer
                            minimum: 0
                          memoryMb:
                            type: integer
                            minimum: 0
                      storage:
                        type: object
                        properties:
                          persist:
                            type: boolean
                            default: false
                          sizeInGb:
                            type: integer
                            minimum: 0
                          iops:
                            type: integer
                            minimum: 0
                  secrets:
                    type: object
                    description: Environment variables injected from Secrets.
                    additionalProperties:
                      type: object
                      description: A key inside a Secret in the same namespace. Credentials belong here,
                        never inline in a spec that lands in git and etcd.
                      required:
                      - name
                      - key
                      properties:
                        name:
                          type: string
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          maxLength: 253
                          description: Secret name.
                        key:
                          type: string
                          pattern: ^[-._a-zA-Z0-9]+$
                          description: Key within the Secret.
                description: The image that performs the work, and the compute it needs.
              execution:
                type: object
                required:
                - mode
                - timeoutSeconds
                properties:
                  mode:
                    enum:
                    - continuous
                    - scheduled
                    - eventDriven
                    type: string
                  schedule:
                    type: object
                    properties:
                      type:
                        enum:
                        - cron
                        - interval
                        - manual
                        type: string
                      cronExpression:
                        type: string
                        pattern: ^(@(annually|yearly|monthly|weekly|daily|hourly)|((\*|[0-9,\-*/]+)\s+){4}(\*|[0-9,\-*/]+))$
                      intervalSeconds:
                        type: integer
                        minimum: 1
                      timezone:
                        type: string
                        default: UTC
                  eventTrigger:
                    type: object
                    properties:
                      batchConfig:
                        type: object
                        properties:
                          minBatchSize:
                            type: integer
                            minimum: 1
                          maxBatchSize:
                            type: integer
                            minimum: 1
                          maxWaitSeconds:
                            type: integer
                            minimum: 1
                  concurrency:
                    type: object
                    properties:
                      maxConcurrentJobs:
                        type: integer
                        minimum: 1
                      maxQueueSize:
                        type: integer
                        minimum: 0
                      queueStrategy:
                        enum:
                        - fifo
                        - priority
                        type: string
                  timeoutSeconds:
                    type: integer
                    minimum: 1
                    maximum: 604800
                description: 'When and how the loop runs: continuously, on a schedule, or on an event.'
              stateManagement:
                type: object
                properties:
                  enabled:
                    type: boolean
                    default: true
                  type:
                    enum:
                    - checkpoint
                    - cursor
                    - watermark
                    type: string
                  storage:
                    type: object
                    properties:
                      backend:
                        enum:
                        - postgres
                        - redis
                        - dynamodb
                        - sqlite
                        type: string
                      location:
                        type: string
                      encryption:
                        type: boolean
                        default: true
                  checkpoint:
                    type: object
                    properties:
                      intervalSeconds:
                        type: integer
                        minimum: 1
                      onBatchComplete:
                        type: boolean
                        default: true
                      strategy:
                        enum:
                        - incremental
                        - full
                        type: string
                  resumeOnRestart:
                    type: boolean
                    default: true
                  deduplication:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                        default: true
                      keyFields:
                        type: array
                        items:
                          type: string
                      windowSeconds:
                        type: integer
                        minimum: 1
                      storage:
                        enum:
                        - redis
                        - postgres
                        type: string
                description: Where checkpoints and run state are stored.
              lifecycle:
                type: object
                properties:
                  pauseConditions:
                    type: object
                    properties:
                      all:
                        type: array
                        items:
                          type: object
                          properties:
                            metric:
                              type: string
                              pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                              maxLength: 253
                              description: Name of the AIMetric this condition reads.
                            operator:
                              enum:
                              - gt
                              - gte
                              - lt
                              - lte
                              - eq
                              - neq
                              type: string
                            threshold:
                              type: number
                            statistic:
                              enum:
                              - Average
                              - Sum
                              - Minimum
                              - Maximum
                              - p50
                              - p90
                              - p95
                              - p99
                              type: string
                            periodSeconds:
                              type: integer
                              minimum: 1
                            evaluationPeriods:
                              type: integer
                              minimum: 1
                            datapointsToTrigger:
                              type: integer
                              minimum: 1
                  resumeConditions:
                    type: object
                    properties:
                      all:
                        type: array
                        items:
                          type: object
                          properties:
                            metric:
                              type: string
                              pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                              maxLength: 253
                              description: Name of the AIMetric this condition reads.
                            operator:
                              enum:
                              - gt
                              - gte
                              - lt
                              - lte
                              - eq
                              - neq
                              type: string
                            threshold:
                              type: number
                            statistic:
                              enum:
                              - Average
                              - Sum
                              - Minimum
                              - Maximum
                              - p50
                              - p90
                              - p95
                              - p99
                              type: string
                            periodSeconds:
                              type: integer
                              minimum: 1
                            evaluationPeriods:
                              type: integer
                              minimum: 1
                            datapointsToTrigger:
                              type: integer
                              minimum: 1
                  stopOnError:
                    type: boolean
                    default: false
                  restartPolicy:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                        default: true
                      maxRestarts:
                        type: integer
                        minimum: 0
                      restartDelaySeconds:
                        type: integer
                        minimum: 0
                      backoffMultiplier:
                        type: number
                        minimum: 1
                      resetAfterSeconds:
                        type: integer
                        minimum: 0
                description: Pause, resume and restart behaviour.
              health:
                type: object
                properties:
                  checkIntervalSeconds:
                    type: integer
                    minimum: 1
                  metrics:
                    type: array
                    description: Names of the AIMetrics watched for health.
                    items:
                      type: string
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      maxLength: 253
                      description: RFC 1123 name, as used by metadata.name
                  conditions:
                    type: array
                    items:
                      type: object
                      properties:
                        metric:
                          type: string
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          maxLength: 253
                          description: Name of the AIMetric this condition reads.
                        operator:
                          enum:
                          - gt
                          - gte
                          - lt
                          - lte
                          - eq
                          - neq
                          type: string
                        threshold:
                          type: number
                        statistic:
                          enum:
                          - Average
                          - Sum
                          - Minimum
                          - Maximum
                          - p50
                          - p90
                          - p95
                          - p99
                          type: string
                        periodSeconds:
                          type: integer
                          minimum: 1
                        evaluationPeriods:
                          type: integer
                          minimum: 1
                        datapointsToTrigger:
                          type: integer
                          minimum: 1
                description: Metrics watched to decide whether the loop is healthy.
              observability:
                type: object
                properties:
                  logs:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  metrics:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                        default: true
                      trackMetrics:
                        type: boolean
                        default: true
                      names:
                        type: array
                        description: Names of the AIMetrics emitted by this loop.
                        items:
                          type: string
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          maxLength: 253
                          description: RFC 1123 name, as used by metadata.name
                  traces:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                        default: true
                      sampleRate:
                        type: number
                        minimum: 0
                        maximum: 1
                  otelExporter:
                    type: object
                    properties:
                      endpoint:
                        type: string
                      protocol:
                        enum:
                        - grpc
                        - http
                        - protobuf
                        type: string
                      headers:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                      resourceAttributes:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                description: Logging, tracing and metric emission for runs.
