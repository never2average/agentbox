                  maxReplicas:
                    type: integer
                    minimum: 1
                    maximum: 10000
              metrics:
                type: array
                minItems: 1
                items:
                  type: object
                  description: A single scaling signal, sourced from an AIMetric or a raw resource metric
                  required:
                  - type
                  - target
                  properties:
                    type:
                      enum:
                      - aiMetric
                      - resource
                      - external
                      type: string
                    metric:
                      type: string
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      maxLength: 253
                      description: Name of the AIMetric supplying this signal.
                    resource:
                      enum:
                      - cpu
                      - memory
                      - gpu
                      - gpuMemory
                      type: string
                    name:
                      type: string
                    selector:
                      type: object
                      additionalProperties:
                        type: string
                    target:
                      type: object
                      required:
                      - metricType
                      - value
                      properties:
                        metricType:
                          enum:
                          - utilization
