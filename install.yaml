                    default: http
                    type: string
                  port:
                    type: integer
                    minimum: 1
                    maximum: 65535
                  basePath:
                    type: string
                    default: /
                    pattern: ^/
                description: Port and base path the server listens on. A Service is created for it.
              tools:
                type: array
                minItems: 1
                items:
                  type: object
                  description: A single tool served by this server.
                  required:
                  - name
                  - parameters
                  - returns
                  properties:
                    name:
                      type: string
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      maxLength: 253
                      description: RFC 1123 name, as used by metadata.name
                    description:
                      type: string
                    path:
                      type: string
                      description: Path this tool is served on, relative to the server endpoint.
                      pattern: ^/
                    method:
                      enum:
                      - GET
                      - POST
                      - PUT
                      - PATCH
                      - DELETE
                      default: POST
                      type: string
                    parameters:
                      type: object
                      required:
                      - type
                      properties:
                        type:
                          enum:
                          - object
                          type: string
                        properties:
                          type: object
                          description: JSON Schema properties for the tool's arguments.
                          x-kubernetes-preserve-unknown-fields: true
                        required:
                          type: array
                          items:
                            type: string
                    returns:
                      type: object
                      required:
                      - type
                      properties:
                        type:
                          enum:
                          - object
                          - string
                          - number
                          - boolean
                          - array
                          type: string
                        description:
                          type: string
                        schema:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                    timeoutSeconds:
                      type: integer
                      minimum: 1
                      default: 30
                    examples:
                      type: array
                      items:
                        type: object
                        properties:
                          description:
                            type: string
                          input:
                            type: object
                            x-kubernetes-preserve-unknown-fields: true
                          output:
                            type: object
                            x-kubernetes-preserve-unknown-fields: true
                maxItems: 64
                description: Contracts for the tools this server exposes, so callers can discover them.
              replicas:
                type: integer
                minimum: 0
                default: 1
                description: Desired replicas. Ignored while a ToolServerAutoScaler owns this server.
                maximum: 10000
              compute:
                type: object
                description: CPU, memory, GPU and storage requested per replica.
                properties:
                  cpu:
                    type: object
                    properties:
                      cores:
                        type: number
                        minimum: 0
                        maximum: 1024
                      threads:
                        type: integer
                        minimum: 0
                      memoryMb:
                        type: integer
                        minimum: 16
                  gpu:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                        default: false
                      type:
                        type: string
                      count:
                        type: integer
                        minimum: 0
                      memoryMb:
                        type: integer
                        minimum: 0
                  storage:
                    type: object
                    properties:
                      persist:
                        type: boolean
                        default: false
                      sizeInGb:
                        type: integer
                        minimum: 0
                      iops:
                        type: integer
                        minimum: 0
              env:
                type: object
                additionalProperties:
                  type: string
                description: Environment variables passed to the image. Secret-looking values are moved
                  into a Secret.
              enabled:
                type: boolean
                default: true
                description: Set false to keep the definition but stop serving.
              version:
                type: string
                description: Version of the tool contracts, for callers that pin.
              stateManagement:
                type: object
                properties:
                  persistentState:
                    type: boolean
                    default: false
                  stateStorage:
                    enum:
                    - memory
                    - redis
                    - database
                    type: string
                  stateKey:
                    type: string
                  stateTtlSeconds:
                    type: integer
                    minimum: 0
                    default: 3600
                  sharedAcrossSessions:
                    type: boolean
                    default: false
                description: Whether tool calls carry state, and where that state lives.
              permissions:
                type: object
                properties:
                  requiredScopes:
                    type: array
                    items:
                      type: string
                  allowedRoles:
                    type: array
                    items:
                      type: string
                  requiresApproval:
                    type: boolean
                    default: false
                description: Scopes and roles required to call these tools.
              monitoring:
                type: object
                properties:
                  logExecution:
                    type: boolean
                    default: true
                  logLevel:
                    enum:
                    - debug
                    - info
                    - warning
                    - error
                    type: string
                  trackMetrics:
                    type: boolean
                    default: true
                description: Logging and metric collection for tool calls.
              files:
                type: object
                description: Files written into the container from a ConfigMap or Secret. The key is the
                  mount path.
                additionalProperties:
                  type: object
                  required:
                  - name
                  properties:
                    name:
                      type: string
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      maxLength: 253
                      description: ConfigMap or Secret name in the same namespace.
                    kind:
                      enum:
                      - ConfigMap
                      - Secret
                      default: ConfigMap
                      type: string
              secrets:
                type: object
                description: Environment variables injected from Secrets.
                additionalProperties:
                  type: object
                  description: A key inside a Secret in the same namespace. Credentials belong here, never
