    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        description: 'Training-plane evaluator: evaluation suite, dataset binding and scoring for a target
          resource.'
        required:
        - spec
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            properties:
              name:
                type: string
                description: Human-readable name for this evaluation suite.
              description:
                type: string
                description: What this suite measures.
              dataset:
                type: object
                description: Where the evaluation cases come from.
                properties:
                  inline:
                    type: object
                    required:
                    - cases
                    properties:
                      cases:
                        type: array
                        minItems: 1
                        items:
                          type: object
                          required:
                          - input
                          properties:
                            id:
                              type: string
                            input:
                              type: object
                              x-kubernetes-preserve-unknown-fields: true
                            expected:
                              x-kubernetes-preserve-unknown-fields: true
                            metadata:
                              type: object
                              x-kubernetes-preserve-unknown-fields: true
                  file:
                    type: object
                    required:
                    - path
                    properties:
                      path:
                        type: string
                      format:
                        enum:
                        - jsonl
                        - json
                        - csv
                        default: jsonl
                        type: string
                      fieldMapping:
                        type: object
                        properties:
                          input:
                            type: string
                          expected:
                            type: string
                          id:
                            type: string
                      encoding:
                        type: string
                        default: utf-8
                  ioConnector:
                    type: object
                    required:
                    - dataset
                    properties:
                      dataset:
                        type: string
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                        maxLength: 253
                        description: Name of the dataset supplying evaluation cases.
                      filters:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                      batchSize:
                        type: integer
                        minimum: 1
                        default: 100
              scoring:
                type: object
                required:
                - metrics
                properties:
                  metrics:
                    type: array
                    minItems: 1
                    items:
                      type: object
                      required:
                      - metric
                      properties:
                        metric:
                          x-kubernetes-preserve-unknown-fields: true
                        weight:
                          type: number
                          minimum: 0
                          default: 1
                  aggregation:
                    enum:
                    - weightedAverage
                    - min
                    - max
                    - allPass
                    default: weightedAverage
                    type: string
                  passThreshold:
                    type: number
                    minimum: 0
                    maximum: 1
                    default: 0.8
                description: Metrics applied to each case, and how they combine into a score.
              runConfig:
                type: object
                properties:
                  image:
                    type: string
                    pattern: ^[a-z0-9]([a-z0-9._\-/]*[a-z0-9])?(:[\w][\w.\-]{0,127})?(@sha256:[a-f0-9]{64})?$
                    description: Image that executes this suite when a run is requested.
                  seed:
                    type: integer
                    minimum: 0
                    default: 42
                  maxConcurrency:
                    type: integer
                    minimum: 1
                    default: 1
                  timeoutSeconds:
                    type: integer
                    minimum: 1
                    default: 60
                  stopOnFail:
                    type: boolean
                    default: false
                  randomizeOrder:
                    type: boolean
                    default: false
                  retriesOnError:
                    type: integer
                    minimum: 0
                    default: 0
                  storeOutputs:
                    type: boolean
                    default: true
                  logLevel:
                    enum:
                    - debug
                    - info
                    - warning
                    - error
                    default: info
                    type: string
                description: Concurrency, retries and sampling for a run.
              tags:
                type: array
                items:
                  type: string
                description: Free-form labels for discovery.
              metadata:
                type: object
                properties:
                  description:
                    type: string
                  tags:
                    type: array
                    items:
                      type: string
                  owner:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                  version:
                    type: string
                description: Free-form annotations.
            required:
            - name
