                    items:
                      type: string
                  allowedRoles:
                    type: array
                    items:
                      type: string
                  allowedActions:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  requiresApproval:
                    type: boolean
                    default: false
                description: Who may start, pause and inspect this loop.
              metadata:
